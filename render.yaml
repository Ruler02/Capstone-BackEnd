# Konfigurasi backend untuk hosting Docker yang RAM-nya kecil
# (mis. Render Free, 512 MB RAM).
#
# PENTING: file ini TIDAK menyalin folder model ke image. Folder `Model-*/`
# berukuran ±484 MB dan tidak ada di GitHub (hanya di repo HF Spaces lewat
# Git LFS). Kalau image tries `COPY` folder itu, build akan gagal.
#
# Konsekuensi: NER berjalan pada mode `fake`, yaitu ekstraksi entitas
# otomatis dimock. Alur aplikasi (4 role, verifikasi, eskalasi, penugasan,
# laporan lapangan, peta) tetap berjalan penuh. Untuk NER sungguhan,
# pakai `render.yaml` (RAM besar) atau hosting lain yang mengizinkan.
#
#ijnenkelijk: file ini dipakai kalau Render Free dipakai. Untuk hosting
# dengan RAM besar, pakai `render.yaml` yang menyertakan model.

services:
  - type: web
    name: sigap-bnpb-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerfileContext: ./Dockerfile.render-free
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ASR_BACKEND
        value: fake
      - key: NER_BACKEND
        value: fake
      - key: GEOCODER_BACKEND
        value: fake
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: log
      - key: STORAGE_BACKEND
        value: local
      - key: R2_BUCKET
        value: sigap-media
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
